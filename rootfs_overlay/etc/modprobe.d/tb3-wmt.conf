# Unloading the MT8127 WMT stack (CONSYS, BTIF, WMT core and its Wi-Fi,
# Bluetooth and FM drivers) can hang the tablet. `modprobe -r` runs these
# commands instead of removing the modules, and fails.
remove wlan_mt /bin/false
remove mtk_consys_bt /bin/false
remove mtk_consys_fm /bin/false
remove mtk_stp_wmt_soc /bin/false
remove mtk_btif /bin/false
remove mt8127_consys /bin/false

# The WMT core and STP default to info-level logs, printed without a log
# level (so at warning level) for every power-state change. Warnings and
# errors only (0 error, 1 warning, 2 info, 3 debug, 4 loud).
options mtk_stp_wmt_soc dbg_level=1 stp_dbg_level=1
