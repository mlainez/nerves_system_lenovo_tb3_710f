#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "lenovo_tb3_710f")
define(NERVES_FW_ARCHITECTURE, "armv7")
define(NERVES_FW_AUTHOR, "Spin42")

# The firmware lives in the stock Android userdata partition, mmcblk0p7. The
# eMMC has an MTK-style MBR/EBR table without partition names and no SD card
# host is enabled, so the number is stable. The citronics initramfs maps the
# nested MBR with kpartx and links /dev/mmcblk0p7pN to /dev/mapper/mmcblk0p7pN
# (Linux numbers nested partitions from 1).
define(NERVES_FW_DEVPATH, "/dev/mmcblk0p7")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p7p3")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# This configuration file will be inserted by fwup at the start of complete
# and provision, to set serial numbers and other per-device values.
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Layout of mmcblk0p7 in 512-byte blocks, relative to the partition start
# (absolute eMMC block = 4608000 + offset):
#
# +-----------------------------+ 0
# | MBR (nested)                |
# +-----------------------------+ 2048 (1 MiB)
# | fwup env, U-Boot format     |
# | (8 KiB)                     |
# +-----------------------------+ 2064
# | Boot A (FAT, 64 MiB)        |
# +-----------------------------+ 133136
# | Boot B (FAT, 64 MiB)        |
# +-----------------------------+ 264208
# | Rootfs A (squashfs 512 MiB) |
# +-----------------------------+ 1312784
# | Rootfs B (squashfs 512 MiB) |
# +-----------------------------+ 2361360
# | Application (f2fs 4032 MiB) |
# +-----------------------------+ 10618880 (end of the Nerves image)
# | unused margin (2.25 MiB)    |
# +-----------------------------+ 10623488 (end of USRDATA in the MTK scatter)
# | MTK BMT pool (21 MiB)       |  never written: Linux shows it as part of
# +-----------------------------+  mmcblk0p7 (10661888 blocks)
#
# The MBR always lists the slot that boots next as partitions 1 (boot) and 2
# (rootfs), and the application data as partition 3; the inactive slot is
# not in the table. The second-stage bootloader in the `boot` partition reads
# /extlinux/extlinux.conf from nested partition 1, so switching slots is one
# MBR write (plus nerves_fw_active for Nerves Runtime).

define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 16)  # 8 KiB

# Boot slots: FAT with /extlinux/extlinux.conf, zImage, the DTB, zImage-dtb
# (zImage with the DTB appended) and the citronics initramfs.
define-eval(BOOT_A_PART_OFFSET, "${UBOOT_ENV_OFFSET} + ${UBOOT_ENV_COUNT}")
define(BOOT_A_PART_COUNT, 131072)
define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, 131072)

define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Fixed size, never `expand = true`: mmcblk0p7 runs 21 MiB past the scatter's
# USRDATA into the MTK BMT pool, and the application partition ends 4608
# blocks before USRDATA does.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 8257520)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
