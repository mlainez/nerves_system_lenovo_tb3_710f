# Boot configuration read by the second-stage bootloader (U-Boot `sysboot`)
# from the active boot slot, nested partition 1 of userdata (mmcblk0p7).
# fwup rewrites the nested MBR on every upgrade and revert so that partition
# 1 is the boot slot and partition 2 the rootfs that should run; the same
# file therefore works in both slots. Paths are relative to the root of the
# FAT boot slot. zImage-dtb (zImage with the DTB appended) is in the slot
# too, for a bootloader that cannot load a separate DTB.
#
# Command line:
#   console=tty0  the panel; the tablet has no usable UART
#   quiet  errors only on the screen (console loglevel 4), as in the
#       official Nerves systems: the panel shows the MOTD and the IEx
#       prompt, the full kernel log stays in dmesg and RingLogger
#   regulator_ignore_unused  keep the eMMC, USB and IO rails the bootloader
#       enabled: they have no consumer in the device tree
#   panic=10  reboot 10 s after a panic
#   rootfs=  the citronics initramfs maps the nested MBR of mmcblk0p7 with
#       kpartx and mounts this squashfs root; erlinit mounts the FAT boot
#       slot on /boot
default nerves

label nerves
	kernel /zImage
	fdt /mt8127-lenovo-tb3-710f.dtb
	initrd /initramfs.gz
	append console=tty0 quiet regulator_ignore_unused panic=10 rootfs=/dev/mmcblk0p7p2 rootfstype=squashfs ro rootwait
